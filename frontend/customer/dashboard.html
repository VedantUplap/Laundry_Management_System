<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LSMS — My Dashboard</title>
  <link rel="stylesheet" href="/assets/css/styles.css"/>
</head>
<body>
<div class="app-shell">
  <nav class="sidebar">
    <a href="/customer/dashboard.html" class="sidebar-logo"><div class="sidebar-logo-icon">🧺</div><div><div class="sidebar-logo-text">LSMS</div><div class="sidebar-logo-sub">Customer Portal</div></div></a>
    <div class="sidebar-section-label">My Account</div>
    <a href="/customer/dashboard.html" class="nav-item active"><span class="nav-icon">🏠</span> Dashboard</a>
    <a href="/customer/place-order.html" class="nav-item"><span class="nav-icon">➕</span> Place New Order</a>
    <a href="/customer/orders.html" class="nav-item"><span class="nav-icon">📦</span> My Orders</a>
    <a href="/customer/feedback.html" class="nav-item"><span class="nav-icon">⭐</span> Feedback</a>
    <div class="sidebar-footer"><div class="sidebar-user"><div class="sidebar-avatar" id="sidebar-avatar">C</div><div><div class="sidebar-user-name" id="sidebar-user-name">Customer</div><div class="sidebar-user-role" id="sidebar-user-role">customer</div></div><button onclick="logout()" title="Logout" style="margin-left:auto;background:none;border:none;color:var(--text-muted);font-size:1.1rem;cursor:pointer">🚪</button></div></div>
  </nav>
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-title">My Dashboard</div>
      <div class="topbar-actions"><a href="/customer/place-order.html" class="btn btn-primary btn-sm">+ Place Order</a></div>
    </header>
    <main class="page-content">
      <div id="welcome-banner" style="margin-bottom:1.5rem;padding:1.5rem;background:linear-gradient(135deg,rgba(99,102,241,0.2),rgba(34,211,238,0.1));border:1px solid rgba(99,102,241,0.3);border-radius:var(--radius-lg)">
        <h2 id="welcome-name" style="font-size:1.3rem;font-weight:700">Welcome back! 👋</h2>
        <p style="color:var(--text-secondary);margin-top:0.25rem;font-size:0.9rem">Here's an overview of your laundry orders and billing.</p>
      </div>

      <div class="stats-grid" id="cust-stats">
        <div class="loading-overlay"><div class="spinner"></div></div>
      </div>

      <div style="display:grid;grid-template-columns:1.5fr 1fr;gap:1.25rem;margin-top:1.5rem">
        <div class="card">
          <div class="card-header"><div class="card-title">📦 Recent Orders</div><a href="/customer/orders.html" class="btn btn-secondary btn-sm">View All</a></div>
          <div id="recent-orders"></div>
        </div>
        <div class="card">
          <div class="card-header"><div class="card-title">🧺 Available Services</div></div>
          <div id="services-list"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="/assets/js/api.js"></script>
<script>
if (!requireAuth(['customer'])) {}
populateSidebarUser();

const user = Auth.getUser();
document.getElementById('welcome-name').textContent = `Welcome back, ${user.firstName || 'Customer'}! 👋`;

async function loadDashboard() {
  try {
    const [ordersRes, servicesRes] = await Promise.all([
      api.getOrders(),
      api.getServices(true),
    ]);
    const orders = ordersRes.data;

    const delivered = orders.filter(o => o.Status === 'Delivered').length;
    const active    = orders.filter(o => !['Delivered','Cancelled'].includes(o.Status)).length;
    const totalSpent= orders.reduce((s, o) => s + parseFloat(o.TotalCost || 0), 0);
    const pending   = orders.filter(o => o.BillStatus && o.BillStatus !== 'Paid').length;

    document.getElementById('cust-stats').innerHTML = `
      <div class="stat-card"><div class="stat-icon blue">📦</div><div><div class="stat-label">Total Orders</div><div class="stat-value">${orders.length}</div></div></div>
      <div class="stat-card"><div class="stat-icon purple">⚙️</div><div><div class="stat-label">Active Orders</div><div class="stat-value">${active}</div></div></div>
      <div class="stat-card"><div class="stat-icon green">✅</div><div><div class="stat-label">Delivered</div><div class="stat-value">${delivered}</div></div></div>
      <div class="stat-card"><div class="stat-icon yellow">💰</div><div><div class="stat-label">Total Spent</div><div class="stat-value" style="font-size:1.3rem">${fmt.currency(totalSpent)}</div></div></div>
    `;

    // Recent orders
    const recentEl = document.getElementById('recent-orders');
    const recent = orders.slice(0, 5);
    if (!recent.length) {
      recentEl.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📦</div><h3>No orders yet</h3><p><a href="/customer/place-order.html" class="btn btn-primary btn-sm" style="margin-top:0.75rem">Place Your First Order</a></p></div>`;
    } else {
      recentEl.innerHTML = recent.map(o => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:0.75rem 0;border-bottom:1px solid var(--border)">
          <div>
            <div style="font-weight:600">Order #${o.OrderID}</div>
            <div style="font-size:0.78rem;color:var(--text-muted)">${fmt.date(o.OrderDate)} · ${fmt.currency(o.TotalCost)}</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:0.3rem">
            ${statusBadge(o.Status)}
            <a href="/customer/orders.html" style="font-size:0.72rem;color:var(--primary-light)">View →</a>
          </div>
        </div>
      `).join('');
    }

    // Services
    const svcEl = document.getElementById('services-list');
    svcEl.innerHTML = servicesRes.data.map(s => `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:0.6rem 0;border-bottom:1px solid var(--border)">
        <div style="font-weight:500">${s.ServiceName}</div>
        <div style="font-size:0.875rem;color:var(--primary-light);font-weight:600">${fmt.currency(s.PricePerKg)}/kg</div>
      </div>
    `).join('');
  } catch (err) { showToast(err.message, 'error'); }
}

loadDashboard();
</script>
</body>
</html>
